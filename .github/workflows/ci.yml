name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django tests
        run: |
          cd backend
          python manage.py test

      - name: Lint with Flake8
        run: |
          pip install flake8
          flake8 backend/

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd frontend
          yarn install

      - name: Run React tests
        run: |
          cd frontend
          yarn test

      - name: Lint with ESLint
        run: |
          cd frontend
          yarn lint

  code-rabbit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Run CodeRabbit
        uses: coderabbitai/coderabbit-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}