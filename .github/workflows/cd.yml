# .github/workflows/cd.yml
name: Django+React CD

on:
  push:
    branches: [ "main" ] # Trigger staging deployment
  create:
    tags:
      - v*.*.* # Trigger production deployment on version tags (e.g., v1.0.0)

jobs:
  # --- STAGING DEPLOYMENT ---
  deploy-staging:
    if: github.ref == 'refs/heads/main' # Run only for pushes to main
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://${{ secrets.SSH_HOST }} # Optional: Link to your staging URL

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push Docker image for Staging
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/django-ci-project:staging

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GH_PAT }}"
            docker pull ghcr.io/${{ github.repository_owner }}/django-ci-project:staging
            docker stop staging-app || true
            docker rm staging-app || true
            docker run -d --name staging-app -p 80:8000 --restart always ghcr.io/${{ github.repository_owner }}/django-ci-project:staging

  # --- PRODUCTION DEPLOYMENT ---
  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') # Run only for version tags
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ secrets.SSH_HOST }} # Optional: Link to your production URL
    
    needs: deploy-staging # Optional: ensure staging passes before prod can run (for PR-based flows)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push Docker image for Production
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/django-ci-project:latest
            ghcr.io/${{ github.repository_owner }}/django-ci-project:${{ github.ref_name }}

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GH_PAT }}"
            docker pull ghcr.io/${{ github.repository_owner }}/django-ci-project:${{ github.ref_name }}
            docker stop prod-app || true
            docker rm prod-app || true
            docker run -d --name prod-app -p 80:8000 --restart always ghcr.io/${{ github.repository_owner }}/django-ci-project:${{ github.ref_name }}